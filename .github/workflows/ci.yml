name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      ref:
        description: Commit a ser testado
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes
        run: pytest
